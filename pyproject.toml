[project]
name = "adv-genai"
version = "0.1.0"
description = "Advanced Agentic AI & AI Agents with Generative AI — course repository"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=1.60,<2",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
    "pytest>=8.2,<9",
    "jupyter>=1.1,<2",
    "nbformat>=5.10,<6",
    "tiktoken>=0.11,<1",
    "numpy>=2.0,<3",
    "matplotlib>=3.9,<4",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
